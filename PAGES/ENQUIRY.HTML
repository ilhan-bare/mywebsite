<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Enquiry | Maniza Perfume</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Josefin+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Main stylesheet -->
    <link rel="stylesheet" href="../CSS/STYLE.CSS">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="site-header">

        <div class="nav-wrap">

            <a href="INDEX.HTML" class="brand">
                <span class="brand-mark">✦</span>
                <span>Maniza Perfume</span>
            </a>

            <button class="nav-toggle" type="button" aria-label="Open navigation">
                Menu
            </button>

            <nav class="primary-nav" aria-label="Main navigation">

                <ul>

                    <li>
                        <a href="INDEX.HTML">Home</a>
                    </li>

                    <li>
                        <a href="PERFUMS.HTML">Perfumes</a>
                    </li>

                    <li>
                        <a href="ABOUT.HTML">About</a>
                    </li>

                    <li>
                        <a href="ENQUIRY.HTML" aria-current="page">Enquiry</a>
                    </li>

                    <li>
                        <a href="CONTACT.HTML">Contact</a>
                    </li>

                </ul>

            </nav>

        </div>

    </header>


    <!-- ================= ENQUIRY ================= -->

    <main>

        <section class="enquiry-page">

            <div class="enquiry-content">

                <h1>Make an Enquiry</h1>

                <p>
                    Have a question about our perfumes?
                    Complete the form below and we will get back to you.
                </p>


                <form>

                    <div class="form-group">

                        <label for="name">Full Name</label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="email">Email Address</label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email address"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="phone">Phone Number</label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="Enter your phone number"
                        >

                    </div>


                    <div class="form-group">

                        <label for="subject">Subject</label>

                        <input
                            type="text"
                            id="subject"
                            name="subject"
                            placeholder="What is your enquiry about?"
                        >

                    </div>


                    <div class="form-group">

                        <label for="message">Your Enquiry</label>

                        <textarea
                            id="message"
                            name="message"
                            rows="6"
                            placeholder="Write your enquiry here..."
                            required
                        ></textarea>

                    </div>


                    <button type="submit">
                        Send Enquiry
                    </button>

                </form>

            </div>

        </section>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer class="site-footer">

        <div class="footer-content">

            <h2>Maniza Perfume</h2>

            <p>
                Quality fragrances for every occasion.
            </p>

            <p>
                &copy; 2026 Maniza Perfume. All rights reserved.
            </p>

        </div>

    </footer>


    <!-- ================= MOBILE MENU ================= -->

    <script>

        const navToggle = document.querySelector('.nav-toggle');
        const primaryNav = document.querySelector('.primary-nav');

        navToggle.addEventListener('click', function () {

            primaryNav.classList.toggle('open');

        });

    </script>

</body>

</html>
